<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อัปโหลดเอกสารยืนยัน | ARSATU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- โหลด Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; }</style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-black text-gray-900 tracking-wider">ARSATU<span class="text-indigo-500">.</span></h1>
            <p class="text-gray-500 text-sm mt-1">อัปโหลดเอกสารขอยืมพัสดุ (ที่ลงนามแล้ว)</p>
        </div>

        <!-- 1. ส่วนแสดงข้อมูลคำขอ -->
        <div id="project-info" class="mb-6 text-center bg-indigo-50 border border-indigo-100 p-4 rounded-xl">
            <h2 class="text-xl font-bold text-gray-800">
                รหัสคำขอ: <span id="req-code-display" class="text-indigo-600 font-mono">กำลังโหลด...</span>
            </h2>
            <p id="project-name-display" class="text-md text-gray-600 font-medium mt-2">โครงการ: -</p>
        </div>

        <!-- 2. ป้ายเตือนกรณีที่ส่งเอกสารไปแล้ว (ค่าเริ่มต้นคือซ่อนไว้) -->
        <div id="status-message" class="hidden mb-6 p-4 text-center rounded-xl font-bold"></div>

        <!-- 3. โซนฟอร์มอัปโหลด (ที่จะถูกซ่อนถ้าส่งเอกสารแล้ว) -->
        <div id="upload-section">
            <form id="upload-form" class="space-y-4">
                
                <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-indigo-500 transition-colors bg-gray-50">
                    <svg class="mx-auto h-12 w-12 text-gray-400 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <label class="cursor-pointer">
                        <span class="mt-2 block text-sm font-medium text-indigo-600 hover:text-indigo-500">เลือกไฟล์ PDF</span>
                        <input type="file" id="pdf-file" accept="application/pdf" class="hidden" required>
                    </label>
                    <p class="mt-1 text-xs text-gray-500" id="file-name-display">ยังไม่ได้เลือกไฟล์ (เฉพาะ .pdf)</p>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-lg transition-colors flex items-center justify-center gap-2">
                    📤 อัปโหลดเอกสาร
                </button>
            </form>
            
            <p class="text-xs text-center text-gray-400 mt-4">
                *กรุณาตรวจสอบความถูกต้องของลายเซ็นก่อนอัปโหลด<br>
                หากอัปโหลดแล้วจะไม่สามารถแก้ไขได้
            </p>
        </div>

    </div>

    <!-- โหลดสคริปต์ตามลำดับ -->
    <script src="../config.js"></script>
    <script src="upload.js"></script>

    <!-- สคริปต์เล็กๆ สำหรับโชว์ชื่อไฟล์ที่เลือก -->
    <script>
        document.getElementById('pdf-file').addEventListener('change', function(e) {
            const fileNameDisplay = document.getElementById('file-name-display');
            if (e.target.files.length > 0) {
                fileNameDisplay.textContent = e.target.files[0].name;
                fileNameDisplay.classList.add('text-indigo-600', 'font-medium');
            } else {
                fileNameDisplay.textContent = 'ยังไม่ได้เลือกไฟล์ (เฉพาะ .pdf)';
                fileNameDisplay.classList.remove('text-indigo-600', 'font-medium');
            }
        });
    </script>
</body>
</html>
