<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบยืมพัสดุอุปกรณ์ | ARSATU</title>
    
    <!-- CSS & UI Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- PDF-LIB & Fontkit (ไลบรารีใหม่สำหรับหยอดข้อมูลลง Template) -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://unpkg.com/@pdf-lib/fontkit@0.0.4/dist/fontkit.umd.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="text-gray-700 p-4 md:p-8 min-h-screen">
    
    <!-- หน้าจอ 1: หน้าหลัก (เลือกดูของ) -->
    <div class="max-w-5xl mx-auto space-y-6" id="view-home">
        <header class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">🏕️ ระบบยืมพัสดุอุปกรณ์ ARSATU</h1>
                <p class="text-gray-500 mt-2">สำหรับโครงการ องค์กร หรือชุมนุมภายนอก</p>
            </div>
            <button onclick="goToFormView()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-4 rounded-xl font-bold text-lg shadow-lg transition-all">
                📝 สร้างใบคำขอยืมของ
            </button>
        </header>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <h3 class="font-bold text-lg text-gray-800 mb-4 border-l-4 border-indigo-500 pl-3">รายการสิ่งของที่เปิดให้ยืม</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead>
                        <tr class="bg-gray-50 text-gray-500 border-b border-gray-100">
                            <th class="p-4 font-medium">รหัส / ชื่อสิ่งของ</th>
                            <th class="p-4 font-medium">ฝ่ายที่ดูแล</th>
                            <th class="p-4 font-medium text-center">สถานะ</th>
                            <th class="p-4 font-medium text-center">จำนวนที่เหลือ</th>
                        </tr>
                    </thead>
                    <tbody id="public-table-body" class="divide-y divide-gray-50">
                        <tr><td colspan="4" class="text-center p-8 text-gray-400">กำลังโหลดรายการ...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- หน้าจอ 2: กรอกแบบฟอร์ม -->
    <div class="max-w-4xl mx-auto hidden" id="view-form">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100">
            <div class="bg-gray-50 border-b p-4 flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-800">กรอกข้อมูลใบคำขอยืม</h2>
                <button onclick="goToHomeView()" class="text-gray-500 hover:text-gray-800 font-medium">ย้อนกลับ</button>
            </div>
            <form id="borrow-form" class="p-6 md:p-8 space-y-6">
                <!-- ข้อมูลผู้ยืม -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-bold text-indigo-700 mb-1">อีเมลผู้ประสานงาน (รับเอกสารผ่านทางนี้) *</label>
                        <input type="email" id="req-email" required class="w-full bg-indigo-50/50 border border-indigo-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-indigo-300">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล ผู้ประสานงาน *</label>
                        <input type="text" id="req-name" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ตำแหน่ง *</label>
                        <input type="text" id="req-position" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรติดต่อ *</label>
                        <input type="tel" id="req-phone" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">LINE ID *</label>
                        <input type="text" id="req-line" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 outline-none focus:border-indigo-500">
                    </div>
                </div>

                <!-- ข้อมูลโครงการและการใช้งาน -->
                <div class="space-y-4 pt-4 border-t">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">สังกัดชุมนุม/กลุ่มอิสระ/องค์กร (ผู้ยืม) *</label>
                        <input type="text" id="req-organization" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อโครงการ / กิจกรรมที่นำไปใช้ *</label>
                        <input type="text" id="req-project" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 outline-none focus:border-indigo-500">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">สถานที่ใช้งาน (ณ) *</label>
                            <input type="text" id="req-location" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">ระหว่างเวลา *</label>
                            <input type="text" id="req-time" placeholder="เช่น 08:00 - 16:00 น." required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-2.5 outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 border-t pt-4 border-dashed">
                        <div>
                            <label class="block text-sm font-medium text-blue-700 mb-1">วันที่ต้องการใช้ (เริ่ม) *</label>
                            <input type="date" id="req-start-date" required class="w-full bg-blue-50 border border-blue-200 rounded-xl p-2.5 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-blue-700 mb-1">ถึงวันที่ใช้งาน (สิ้นสุด) *</label>
                            <input type="date" id="req-end-date" required class="w-full bg-blue-50 border border-blue-200 rounded-xl p-2.5 outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-orange-700 mb-1">วันที่ขอมารับของ (นัดรับ) *</label>
                            <input type="date" id="req-pickup" required class="w-full bg-orange-50 border border-orange-200 rounded-xl p-2.5 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-orange-700 mb-1">วันที่มาส่งคืน (นัดคืน) *</label>
                            <input type="date" id="req-return" required class="w-full bg-orange-50 border border-orange-200 rounded-xl p-2.5 outline-none">
                        </div>
                    </div>
                </div>

                <!-- เลือกของ -->
                <div class="pt-4 border-t">
                    <div class="flex justify-between items-end mb-3 gap-4">
                        <h3 class="font-bold text-gray-800">เลือกรายการสิ่งของ</h3>
                        <!-- ช่องค้นหา -->
                        <div class="relative w-full max-w-xs">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                            <input type="text" id="search-asset-user" onkeyup="filterUserAssets()" placeholder="ค้นหาชื่อ หรือ รหัส..." class="w-full bg-white border border-gray-200 rounded-lg pl-9 pr-3 py-2 text-sm focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all shadow-sm">
                        </div>
                    </div>
                    
                    <div id="item-selection-list" class="space-y-2 max-h-60 overflow-y-auto p-2 bg-gray-50 rounded-xl border border-gray-200">
                        <!-- โหลดจาก JS -->
                    </div>
                </div>

                <div class="pt-6 border-t flex gap-4">
                    <button type="submit" class="w-full bg-gray-800 text-white py-4 rounded-xl font-bold hover:bg-black shadow-lg transition-all text-lg">
                        👁️ ดูตัวอย่างเอกสาร PDF (Preview)
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- หน้าจอ 3: พรีวิว PDF -->
    <div class="fixed inset-0 bg-gray-900/90 backdrop-blur-md hidden flex-col items-center justify-center z-50 p-4" id="view-preview">
        <div class="bg-white w-full max-w-4xl h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="p-4 bg-indigo-600 text-white flex justify-between items-center shrink-0">
                <h2 class="font-bold text-lg">ตรวจสอบความถูกต้องของเอกสาร</h2>
                <button onclick="closePreview()" class="text-white hover:text-gray-200 font-bold bg-white/20 px-3 py-1 rounded-lg">แก้ไขข้อมูล</button>
            </div>
            
            <div class="flex-1 bg-gray-100 p-2 overflow-hidden">
                <iframe id="pdf-preview-frame" class="w-full h-full rounded border-0 bg-white"></iframe>
            </div>

            <div class="p-4 bg-white border-t flex justify-between items-center shrink-0 gap-4">
                <p class="text-sm text-gray-500 flex-1 hidden md:block">* หากถูกต้องครบถ้วน กรุณากดยืนยันเพื่อส่งคำขอเข้าสู่ระบบ</p>
                <button onclick="submitFinalRequest()" id="btn-final-submit" class="w-full md:w-auto bg-green-600 hover:bg-green-700 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg shadow-green-200 transition-all text-lg flex items-center justify-center gap-2">
                    ✅ ยืนยันคำขอ และส่งเข้าอีเมล
                </button>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="user.js"></script>
</body>
</html>
