<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ติดตามและอนุมัติคำขอ | ARSATU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- PDF-LIB และ PDF.js -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }
        /* ซ้อน Canvas ให้พอดีเป๊ะ */
        #pdf-container { position: relative; display: inline-block; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        #pdf-render { display: block; }
        #draw-layer { position: absolute; top: 0; left: 0; cursor: crosshair; touch-action: none; z-index: 10; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-[#f8fafc] text-gray-700 h-screen overflow-hidden">
    
    <!-- โครงสร้างหลัก (Sidebar + Content) -->
    <div id="app-layout" class="flex flex-col md:flex-row h-screen">
        
        <main class="flex-1 overflow-y-auto p-4 md:p-8 relative">
            
            <!-- หน้าจอ 1: รายการคำขอทั้งหมด (ทุกคนเห็น) -->
            <div id="view-list" class="flex-1 overflow-auto max-w-5xl mx-auto w-full">
                <h1 class="text-2xl font-bold text-gray-800 mb-2">📑 ติดตามคำขอยืม (Tracking)</h1>
                <p class="text-sm text-gray-500 mb-6">ตรวจสอบสถานะคำขอยืม และอนุมัติเอกสาร (เฉพาะหัวหน้าฝ่ายที่รับผิดชอบ)</p>
                
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
                    <div id="requests-list" class="space-y-3">กำลังโหลด...</div>
                </div>
            </div>

            <!-- Modal: หน้าต่างแสดงรายละเอียดคำขอ (ทุกคนเห็น) -->
            <div id="details-modal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm hidden items-center justify-center z-40 p-4 transition-opacity">
                <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                        <h2 class="font-bold text-lg text-gray-800">รายละเอียดคำขอยืม</h2>
                        <button onclick="closeDetailsModal()" class="text-gray-400 hover:text-gray-600 bg-white border rounded-full p-1.5 transition-colors">&times;</button>
                    </div>
                    
                    <div class="p-6 overflow-y-auto custom-scrollbar flex-1 space-y-4" id="details-content">
                        <!-- ข้อมูลที่จะดึงมาใส่ด้วย JS -->
                    </div>

                    <div class="p-4 border-t border-gray-100 bg-gray-50 flex justify-end gap-3" id="details-actions">
                        <button onclick="closeDetailsModal()" class="px-5 py-2.5 bg-white border border-gray-200 hover:bg-gray-50 text-gray-700 rounded-xl font-medium transition-colors">ปิดหน้าต่าง</button>
                        <!-- ปุ่ม "เปิดหน้าต่างอนุมัติ" จะโผล่มาตรงนี้ เฉพาะคนที่เป็น Head ของฝ่ายนั้นๆ -->
                    </div>
                </div>
            </div>

            <!-- หน้าจอ 2: กระดานเขียน PDF สด (เฉพาะ Head เข้าถึงได้) -->
            <div id="view-draw" class="hidden flex-col h-full bg-gray-900 absolute inset-0 z-50">
                <div class="bg-gray-800 text-white p-3 md:p-4 flex flex-col md:flex-row justify-between items-center shrink-0 shadow-lg gap-3">
                    <div class="flex items-center gap-4 w-full md:w-auto justify-between">
                        <button onclick="closeDrawView()" class="hover:bg-gray-700 px-3 py-1.5 rounded-lg transition-colors whitespace-nowrap">❌ ปิด/ยกเลิก</button>
                        
                        <!-- 💡 ชุดปุ่มเปลี่ยนหน้า PDF -->
                        <div class="flex items-center gap-2 bg-gray-900 rounded-lg px-2 py-1">
                            <button onclick="changePage(-1)" class="px-3 py-1 hover:text-indigo-400 font-bold">&lt;</button>
                            <span id="page-num-display" class="text-sm font-mono w-16 text-center">1 / 1</span>
                            <button onclick="changePage(1)" class="px-3 py-1 hover:text-indigo-400 font-bold">&gt;</button>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                        <button onclick="clearDrawing()" class="text-red-400 hover:bg-gray-700 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors whitespace-nowrap">🧹 ล้างลายเซ็น</button>
                        <button onclick="confirmAndApprove()" class="bg-green-600 hover:bg-green-700 px-5 py-2 rounded-xl font-bold shadow-md transition-colors flex gap-2 items-center whitespace-nowrap">
                            💾 บันทึกอนุมัติ
                        </button>
                    </div>
                </div>

                <div class="flex-1 overflow-auto flex justify-center p-4 md:p-8 bg-gray-900" id="scroll-area">
                    <div id="pdf-container">
                        <canvas id="pdf-render"></canvas>
                        <canvas id="draw-layer"></canvas>
                    </div>
                </div>
            </div>
            
        </main>
    </div>

    <!-- โหลดสคริปต์ตามลำดับ -->
    <script src="../config.js"></script>
    <script src="layout.js"></script>
    <script src="approvals.js"></script>
</body>
</html>
