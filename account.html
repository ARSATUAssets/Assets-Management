<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บัญชีของฉัน | ARSATU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">

    <div class="bg-white max-w-md w-full rounded-3xl shadow-xl overflow-hidden border border-gray-100">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white text-center relative">
            <h2 class="text-2xl font-bold">ข้อมูลบัญชีของฉัน</h2>
            <p class="text-indigo-100 text-sm mt-1">ตั้งค่าโปรไฟล์สมาชิกค่ายอาสา</p>
        </div>

        <!-- Form -->
        <form id="account-form" class="p-6 space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ - นามสกุล (Display Name)</label>
                <input type="text" id="display_name" required class="w-full border border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">เบอร์โทรศัพท์ (ติดต่อได้)</label>
                <input type="tel" id="phone" required placeholder="เช่น 0812345678" class="w-full border border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ฝ่าย (Department)</label>
                <select id="department_id" required class="w-full border border-gray-200 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none bg-gray-50">
                    <option value="">-- เลือกฝ่ายของคุณ --</option>
                </select>
            </div>

            <!-- ตำแหน่ง (โชว์อย่างเดียว ห้ามแก้) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ตำแหน่งในฝ่าย (Role)</label>
                <input type="text" id="camp_role" readonly class="w-full border border-gray-200 rounded-xl p-3 bg-gray-100 text-gray-500 cursor-not-allowed font-medium" value="กำลังดึงข้อมูล...">
                <p class="text-xs text-red-500 mt-1">* Admin จะเป็นผู้ปรับตำแหน่งหัวหน้าฝ่าย (Head) ให้ทีหลัง</p>
            </div>

            <!-- PIN Code (จะแสดงเฉพาะคนมาใหม่ที่เพิ่งลงทะเบียนเสร็จ) -->
            <div id="pin-section" class="hidden pt-4 border-t border-gray-100">
                <label class="block text-sm font-bold text-indigo-600 mb-1">ยืนยัน PIN Code เพื่อเปิดใช้ระบบ</label>
                <input type="password" id="pin_code" placeholder="ใส่รหัส PIN 6 หลัก" class="w-full border border-indigo-200 rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none bg-indigo-50">
            </div>

            <div class="pt-4 flex gap-3">
                <button type="button" onclick="logout()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-bold transition-colors">ออกจากระบบ</button>
                <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold shadow-md shadow-indigo-200 transition-all">บันทึกข้อมูล</button>
            </div>
        </form>
    </div>

    <script src="config.js"></script>
    <script src="account.js"></script>
</body>
</html>
