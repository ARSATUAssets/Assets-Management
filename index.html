<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ | ARSATU Inventories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- เพิ่มสคริปต์ของ LINE LIFF -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Kanit', sans-serif; background-color: #f8fafc; }</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="bg-white max-w-md w-full rounded-3xl shadow-xl overflow-hidden text-center relative border border-gray-100">
        <div class="h-32 bg-gradient-to-r from-blue-600 to-indigo-600"></div>
        <div class="px-8 pb-10">
            <div class="w-24 h-24 bg-white rounded-full mx-auto -mt-12 shadow-lg flex items-center justify-center text-4xl border-4 border-white">📦</div>
            <h1 class="text-3xl font-bold text-gray-800 mt-6">ARSATU</h1>
            <p class="text-sm font-medium text-blue-600 mt-1 uppercase tracking-widest">Asset Management</p>
            
            <button onclick="loginWithLiff()" class="mt-8 w-full bg-[#06C755] hover:bg-[#05b04b] text-white py-3.5 rounded-2xl font-bold text-lg shadow-md shadow-green-200 transition-all flex items-center justify-center gap-3">
                เข้าสู่ระบบด้วย LINE
            </button>

            <!-- ประตูหลังบ้านสำหรับนักพัฒนา (Backdoor) -->
            <div class="mt-8 pt-6 border-t border-gray-100">
                <p class="text-xs text-gray-400 mb-3 font-medium">🛠️ โหมดทดสอบระบบ (Developer Bypasses)</p>
                <div class="space-y-2">
                    <button onclick="mockLogin('admin')" class="w-full bg-gray-800 hover:bg-gray-900 text-white text-sm py-2.5 rounded-xl font-medium transition-colors shadow-sm">
                        ⭐ จำลองเป็น: Admin (ประธาน)
                    </button>
                    <button onclick="mockLogin('head_location')" class="w-full bg-blue-50 border border-blue-200 hover:bg-blue-100 text-blue-700 text-sm py-2.5 rounded-xl font-medium transition-colors shadow-sm">
                        👑 จำลองเป็น: Head (ฝ่ายสถานที่)
                    </button>
                    <button onclick="mockLogin('member_location')" class="w-full bg-gray-50 border border-gray-200 hover:bg-gray-100 text-gray-700 text-sm py-2.5 rounded-xl font-medium transition-colors shadow-sm">
                        👥 จำลองเป็น: Member (ฝ่ายสถานที่)
                    </button>
                </div>
            </div>
    </div>

    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>
